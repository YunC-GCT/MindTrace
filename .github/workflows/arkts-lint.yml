name: arkts-lint

# Run on push to main, on PRs, and manual dispatch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for same branch on new push
concurrency:
  group: arkts-lint-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read repo contents for checkout. Without this, GITHUB_TOKEN
# has no scopes in repos with restricted default permissions, and actions/checkout@v4
# fails with "Repository not found" when fetching refs/pull/N/merge for PRs.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests (arkts-lint v0.3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/arkts-lint/package.json

      - name: Install dependencies
        working-directory: scripts/arkts-lint
        run: npm ci

      - name: Run rule table validation
        working-directory: scripts/arkts-lint
        run: npm run check-rules

      - name: Run unit tests
        working-directory: scripts/arkts-lint
        run: npm test

  lint-ast:
    name: Lint (arkts-lint v0.3 AST)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/arkts-lint/package.json

      - name: Install dependencies
        working-directory: scripts/arkts-lint
        run: npm ci

      - name: Run AST lint (must exit 0)
        run: node scripts/arkts-lint/index.mjs --quiet

  lint-regex:
    name: Lint (v1 regex, reference)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run regex lint
        run: node scripts/audit-arkts-strict.mjs --quiet