<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="MindTrace 判重决策树：L1 规则、向量兜底、LLM 三分类仲裁，输出 same、supplement、different 三种动作">
  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 11px; fill: #64748b; }
      .n { font-size: 11px; font-weight: 700; fill: #0f766e; letter-spacing: 1px; }
      .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.4; }
      .accent { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.6; }
      .same { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.3; }
      .supp { fill: #fef3c7; stroke: #b45309; stroke-width: 1.3; }
      .diff { fill: #dcfce7; stroke: #166534; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="960" height="400" fill="#f8fafc"/>
  <text x="40" y="36" class="t n">DEDUPE DECISION</text>
  <text x="40" y="62" class="t h" font-size="20">判重不是“相似就丢”：三种裁决对应三种写入动作</text>

  <!-- input -->
  <g class="t">
    <rect x="40" y="152" width="150" height="76" rx="11" class="box"/>
    <text x="56" y="178" class="h">新笔记</text>
    <text x="56" y="197" class="s">标题 / 学科 / 正文</text>
    <text x="56" y="215" class="s">来源与指纹</text>
  </g>

  <path d="M190 190 L 232 190" fill="none" stroke="#0f766e" stroke-width="1.4" marker-end="url(#dt-arrow)"/>

  <!-- L1 -->
  <g class="t">
    <rect x="232" y="152" width="156" height="76" rx="11" class="accent"/>
    <text x="248" y="178" class="h">L1 确定性规则</text>
    <text x="248" y="197" class="s">标题归一 / 来源 ID</text>
    <text x="248" y="215" class="s">≥6 字完全相同</text>
  </g>

  <path d="M388 190 L 430 190" fill="none" stroke="#0f766e" stroke-width="1.4" marker-end="url(#dt-arrow)"/>

  <!-- vector -->
  <g class="t">
    <rect x="430" y="152" width="156" height="76" rx="11" class="box"/>
    <text x="446" y="178" class="h">向量兜底</text>
    <text x="446" y="197" class="s">余弦 ≥ 0.75</text>
    <text x="446" y="215" class="s">进入候选灰区</text>
  </g>

  <path d="M586 190 L 628 190" fill="none" stroke="#0f766e" stroke-width="1.4" marker-end="url(#dt-arrow)"/>

  <!-- LLM -->
  <g class="t">
    <rect x="628" y="152" width="156" height="76" rx="11" class="accent"/>
    <text x="644" y="178" class="h">LLM 三分类</text>
    <text x="644" y="197" class="s">same / supplement</text>
    <text x="644" y="215" class="s">/ different</text>
  </g>

  <!-- branches -->
  <path d="M784 174 C 812 174, 812 104, 840 104" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#dt-arrow)"/>
  <path d="M784 190 L 840 190" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#dt-arrow)"/>
  <path d="M784 206 C 812 206, 812 276, 840 276" fill="none" stroke="#166534" stroke-width="1.4" marker-end="url(#dt-arrow)"/>

  <g class="t">
    <rect x="840" y="72" width="84" height="64" rx="9" class="same"/>
    <text x="854" y="96" class="h" font-size="12">same</text>
    <text x="854" y="114" class="s">不重复写</text>

    <rect x="840" y="158" width="84" height="64" rx="9" class="supp"/>
    <text x="850" y="182" class="h" font-size="12">supplement</text>
    <text x="850" y="200" class="s">写入 + append</text>

    <rect x="840" y="244" width="84" height="64" rx="9" class="diff"/>
    <text x="850" y="268" class="h" font-size="12">different</text>
    <text x="850" y="286" class="s">新建笔记</text>
  </g>

  <text x="40" y="366" class="t s">标定结论：18 条样本中 same 与 supplement 在高分段重叠，且没有 different 负样本，因此不能按向量分砍掉 LLM 仲裁。</text>
</svg>
